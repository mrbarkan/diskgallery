name: DiskGallery
options:
  bundleIdPrefix: com.dbarkan
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: "L26TPPMPF3"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
targets:
  # Pure-logic framework: storage, scanning, duplicate detection, annotations,
  # search. No AppKit/SwiftUI so it stays unit-testable in isolation. Fully
  # encapsulates GRDB — the app never imports GRDB directly.
  DiskGalleryCore:
    type: framework
    platform: macOS
    sources: [DiskGalleryCore]
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dbarkan.DiskGalleryCore
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: NO
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  # SwiftUI app shell. Links only the Core framework.
  DiskGallery:
    type: application
    platform: macOS
    sources: [DiskGallery]
    dependencies:
      - target: DiskGalleryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dbarkan.DiskGallery
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 dbarkan"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        # Beta hard-stop flag, scoped to THIS target only. The beta build passes
        # DG_BETA=BETA on the xcodebuild command line; GRDB and other targets keep
        # their own compilation conditions (passing BETA globally wipes GRDB's
        # SQLITE_ENABLE_FTS5 and breaks the FTS5 search migration).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(DG_BETA)"

  # Unit tests for the Core framework. No TEST_HOST needed (tests a framework).
  DiskGalleryCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [DiskGalleryCoreTests]
    dependencies:
      - target: DiskGalleryCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # UI tests that drive the real app (select/open folders, etc.).
  DiskGalleryUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [DiskGalleryUITests]
    dependencies:
      - target: DiskGallery
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DiskGallery:
    build:
      targets:
        DiskGallery: all
        DiskGalleryUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DiskGalleryUITests
  DiskGalleryCore:
    build:
      targets:
        DiskGalleryCore: all
        DiskGalleryCoreTests: [test]
    test:
      config: Debug
      targets:
        - DiskGalleryCoreTests
