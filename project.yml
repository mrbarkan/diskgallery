name: DiskGallery
options:
  bundleIdPrefix: com.dbarkan
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: "L26TPPMPF3"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"
targets:
  # Pure-logic framework: storage, scanning, duplicate detection, annotations,
  # search. No AppKit/SwiftUI so it stays unit-testable in isolation. Fully
  # encapsulates GRDB — the app never imports GRDB directly.
  DiskGalleryCore:
    type: framework
    platform: macOS
    sources: [DiskGalleryCore]
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dbarkan.DiskGalleryCore
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: NO
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  # SwiftUI app shell. Links only the Core framework.
  DiskGallery:
    type: application
    platform: macOS
    sources: [DiskGallery]
    dependencies:
      - target: DiskGalleryCore
      - package: Sparkle
        product: Sparkle
    info:
      path: DiskGallery/Info.plist
      properties:
        # Sparkle: appcast lives as a release asset on this repo so the
        # "latest" URL never changes. Public key comes from `generate_keys`; the private
        # half stays in the login keychain (see Tools/build-beta-dmg.sh).
        SUFeedURL: https://github.com/mrbarkan/diskgallery/releases/latest/download/appcast.xml
        SUPublicEDKey: Y95K8qPB+GjLM3ssC6l1jOFZqpETG3aVC3D1btrbmd8=
        SUEnableAutomaticChecks: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 dbarkan"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dbarkan.DiskGallery
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "7"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  # Unit tests for the Core framework. No TEST_HOST needed (tests a framework).
  DiskGalleryCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [DiskGalleryCoreTests]
    dependencies:
      - target: DiskGalleryCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # UI tests that drive the real app (select/open folders, etc.).
  DiskGalleryUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [DiskGalleryUITests]
    dependencies:
      - target: DiskGallery
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DiskGallery:
    build:
      targets:
        DiskGallery: all
        DiskGalleryUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DiskGalleryUITests
  DiskGalleryCore:
    build:
      targets:
        DiskGalleryCore: all
        DiskGalleryCoreTests: [test]
    test:
      config: Debug
      targets:
        - DiskGalleryCoreTests
